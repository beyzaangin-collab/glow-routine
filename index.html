<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8e7ed"><link rel="manifest" href="manifest.webmanifest"><title>Glow Routine ✨</title><style>
:root{--bg:#fff9f8;--paper:#fff;--ink:#46333d;--muted:#9b7d8c;--pink:#d77f9f;--soft:#fae9ef;--line:#f0dce4;--green:#6f9c82}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff9f8,#fbeef3);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:720px;margin:auto;padding:20px 16px 90px}.hero{padding:22px 4px 8px}.eyebrow{color:var(--pink);font-size:12px;letter-spacing:2px;font-weight:800}.hero h1{font-size:32px;margin:4px 0}.muted{color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0 18px}.tabs button{flex-shrink:0}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:19px;margin:12px 0;box-shadow:0 9px 25px #9d5d7910}button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:10px 14px;background:var(--soft);color:var(--ink);font-weight:650}button.primary,.tabs button.active{background:var(--pink);color:white}button.danger{color:#b84464;background:#fff0f2}button.small{font-size:13px;padding:7px 10px}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 7px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:flex;flex-direction:column;gap:10px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13px}.chip.on{background:var(--soft);border-color:var(--pink);color:#a94d72}.steps{list-style:none;padding:0;margin:10px 0}.steps li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f6ebee}.steps li:last-child{border:0}.steps input{accent-color:var(--pink);width:20px;height:20px}.steps label{flex:1}.done{text-decoration:line-through;color:var(--muted)}.progress{height:9px;background:var(--soft);border-radius:12px;overflow:hidden}.progress div{height:100%;background:var(--green);transition:width .2s}.hide{display:none!important}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:85px;resize:vertical}.field{display:block;margin:10px 0 5px;font-weight:650;font-size:13px}.hint{font-size:12px;color:var(--muted)}.editline{display:flex;gap:8px;margin:8px 0}.editline input{flex:1;min-width:0}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.pill{display:inline-block;border-radius:30px;background:var(--soft);padding:4px 10px;font-size:12px;color:#a35375}.stat{font-size:28px;font-weight:800;color:#bb6586}.footer{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}.empty{padding:20px;text-align:center;color:var(--muted)}.notice{background:#fff2e9;padding:12px;border-radius:12px;font-size:13px}.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:370px){.hero h1{font-size:28px}.card{padding:14px}}
</style></head><body><main><header class="hero"><div class="eyebrow">YOUR LITTLE GLOW SPACE</div><h1>Glow Routine ✨</h1><div class="muted" id="greeting">Kendine ayırdığın küçük bir an 💕</div></header><nav class="tabs" id="tabs"><button data-tab="today" class="active">🌷 Bugün</button><button data-tab="manage">✏️ Rutinlerim</button><button data-tab="journal">📔 Cilt günlüğü</button><button data-tab="retinal">🌙 Retinal sayacı</button><button data-tab="settings">⚙️ Verilerim</button></nav>
<section id="today"></section><section id="manage" class="hide"></section><section id="journal" class="hide"></section><section id="retinal" class="hide"></section><section id="settings" class="hide"></section><div class="footer">Küçük adımlar, kocaman ışıltılar ✨</div></main>
<script>
(()=>{'use strict';const KEY='glow-routine-v3';const DAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];const ALL=[0,1,2,3,4,5,6];const makeId=()=>globalThis.crypto?.randomUUID?.()||('r'+Date.now().toString(36)+Math.random().toString(36).slice(2));const defaults=()=>({routines:[{id:'morning',name:'Sabah ışıltısı ☀️',period:'Sabah',days:[...ALL],steps:['Nazik temizleme','The Ordinary Hyaluronic Acid %2 + B5','VeNatura C vitamini serumu','Nemlendirici','SPF 50 güneş kremi']},{id:'niacinamide',name:'Niasinamid gecesi 💗',period:'Akşam',days:[1,4],steps:['Nazik temizleme','The Ordinary Hyaluronic Acid %2 + B5','The Ordinary Niacinamide %10 + Zinc %1','Happier Barrier / nemlendirici']},{id:'barrier',name:'Nem & bariyer gecesi 💧',period:'Akşam',days:[0,2,3,5,6],steps:['Nazik temizleme','The Ordinary Hyaluronic Acid %2 + B5','Stress Less (isteğe bağlı)','Happier Barrier / nemlendirici']}],checks:{},journal:{},retinal:[],retinalStarted:false});let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{state=defaults()}if(!Array.isArray(state.routines))state.routines=defaults().routines;if(!state.checks)state.checks={};if(!state.journal)state.journal={};if(!Array.isArray(state.retinal))state.retinal=[];let selectedDate=localDate(new Date()),editing=null,tab='today';function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function dayOf(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getDay()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function el(id){return document.getElementById(id)}function switchTab(t){tab=t;document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hide',x.id!==t));document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));function render(){if(tab==='today')today();if(tab==='manage')manage();if(tab==='journal')journal();if(tab==='retinal')retinal();if(tab==='settings')settings()}
function today(){let dow=dayOf(selectedDate),routines=state.routines.filter(r=>r.days.includes(dow));let total=routines.reduce((a,r)=>a+r.steps.length,0),done=routines.reduce((a,r)=>a+r.steps.filter((_,i)=>state.checks[`${selectedDate}|${r.id}|${i}`]).length,0);el('today').innerHTML=`<div class="card"><div class="row"><div><h2>Bugünün bakım planı</h2><span class="muted">${esc(DAYS[dow])} • ${done}/${total} adım tamamlandı</span></div><span class="pill">${total?Math.round(done/total*100):0}%</span></div><label class="field" for="daypick">Tarih</label><input type="date" id="daypick" value="${selectedDate}"><div class="progress" style="margin-top:13px"><div style="width:${total?done/total*100:0}%"></div></div></div>${routines.length?routines.map(r=>`<article class="card"><div class="sectionTitle"><h2>${esc(r.name)}</h2><span class="pill">${esc(r.period)}</span></div><ul class="steps">${r.steps.map((s,i)=>{let k=`${selectedDate}|${r.id}|${i}`,checked=!!state.checks[k];return `<li><input type="checkbox" data-check="${esc(k)}" id="c-${esc(r.id)}-${i}" ${checked?'checked':''}><label for="c-${esc(r.id)}-${i}" class="${checked?'done':''}">${esc(s)}</label></li>`}).join('')}</ul></article>`).join(''):`<div class="card empty">Bu güne ait rutin yok. Rutinlerim sekmesinden ekleyebilirsin 🌷</div>`}<div class="card notice">✨ Retinale henüz başlamadığın için varsayılan takvimde retinal yok. Siparişin gelince rutin ekleyebilirsin.</div>`;el('daypick').onchange=e=>{selectedDate=e.target.value||localDate(new Date());today()};document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{if(x.checked)state.checks[x.dataset.check]=true;else delete state.checks[x.dataset.check];save();today()})}
function manage(){el('manage').innerHTML=`<div class="sectionTitle"><h2>Rutinlerim 💕</h2><button class="primary" id="newRoutine">+ Yeni rutin</button></div>${state.routines.map(r=>`<div class="card"><div class="row"><div><h3>${esc(r.name)}</h3><span class="muted">${esc(r.period)} • ${r.days.map(d=>DAYS[d].slice(0,3)).join(', ')}</span></div><span class="pill">${r.steps.length} adım</span></div><p class="hint">${r.steps.map(esc).join(' → ')}</p><div class="actionrow"><button class="small" data-edit="${esc(r.id)}">✏️ Düzenle</button><button class="small danger" data-delete="${esc(r.id)}">🗑️ Sil</button></div></div>`).join('')}${editing!==null?editor():''}`;el('newRoutine').onclick=()=>{editing={id:makeId(),name:'',period:'Akşam',days:[...ALL],steps:['']};manage();el('editor').scrollIntoView({behavior:'smooth',block:'start'})};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=structuredClone(state.routines.find(r=>r.id===b.dataset.edit));manage();el('editor').scrollIntoView({behavior:'smooth',block:'start'})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let r=state.routines.find(r=>r.id===b.dataset.delete);if(confirm(`“${r.name}” rutinini silmek istiyor musun?`)){state.routines=state.routines.filter(x=>x.id!==r.id);save();manage()}});if(editing!==null)bindEditor()}
function editor(){return `<div class="card" id="editor"><h2>${state.routines.some(r=>r.id===editing.id)?'Rutini düzenle':'Yeni rutin oluştur'} ✨</h2><label class="field">Rutin adı</label><input id="routineName" maxlength="80" value="${esc(editing.name)}" placeholder="Örn. Retinal gecesi 🌙"><label class="field">Zaman</label><select id="routinePeriod"><option ${editing.period==='Sabah'?'selected':''}>Sabah</option><option ${editing.period==='Akşam'?'selected':''}>Akşam</option><option ${editing.period==='Diğer'?'selected':''}>Diğer</option></select><label class="field">Uygulanacak günler</label><div class="chips">${DAYS.map((d,i)=>`<button class="chip ${editing.days.includes(i)?'on':''}" data-day="${i}">${d}</button>`).join('')}</div><label class="field">Ürünler / adımlar</label><div id="editSteps">${editing.steps.map((s,i)=>`<div class="editline"><input data-step="${i}" value="${esc(s)}" placeholder="Ürün veya bakım adımı"><button class="danger small" data-remove="${i}" aria-label="Adımı sil">✕</button></div>`).join('')}</div><button class="small" id="addStep">+ Adım ekle</button><div class="actionrow"><button class="primary" id="saveRoutine">Kaydet 💗</button><button id="cancelRoutine">Vazgeç</button></div><p class="hint">Not: Rutin adımlarını değiştirdiğinde eski işaretlemeler aynı sıradaki yeni adımlara aktarılabilir. Geçmişini korumak için verilerini yedekleyebilirsin.</p></div>`}
function collect(){editing.name=el('routineName').value;editing.period=el('routinePeriod').value;editing.steps=[...document.querySelectorAll('[data-step]')].map(x=>x.value)}function bindEditor(){document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{collect();let n=Number(b.dataset.day);editing.days=editing.days.includes(n)?editing.days.filter(x=>x!==n):[...editing.days,n].sort();manage()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{collect();editing.steps.splice(Number(b.dataset.remove),1);manage()});el('addStep').onclick=()=>{collect();editing.steps.push('');manage()};el('cancelRoutine').onclick=()=>{editing=null;manage()};el('saveRoutine').onclick=()=>{collect();editing.name=editing.name.trim();editing.steps=editing.steps.map(s=>s.trim()).filter(Boolean);if(!editing.name||!editing.steps.length||!editing.days.length){alert('Rutin adı, en az bir gün ve bir adım gerekli 💗');return}let idx=state.routines.findIndex(r=>r.id===editing.id);if(idx>=0)state.routines[idx]=editing;else state.routines.push(editing);editing=null;save();manage()}}
function journal(){let j=state.journal[selectedDate]||{};el('journal').innerHTML=`<div class="card"><h2>Cilt günlüğüm 📔</h2><label class="field">Tarih</label><input type="date" id="journalDate" value="${selectedDate}"><label class="field">Bugün cildin nasıldı?</label><select id="skinMood">${['','Nemli ve rahat ✨','Kuru 💧','Hassas / kızarık 🌸','Komedon / pütürlü','Işıltılı 🌟'].map(x=>`<option ${j.mood===x?'selected':''}>${esc(x)}</option>`).join('')}</select><label class="field">Notlarım</label><textarea id="skinNote" placeholder="Bugün cildim nasıl hissetti?">${esc(j.note||'')}</textarea><div class="actionrow"><button class="primary" id="saveJournal">Günlüğü kaydet</button></div></div><div class="card"><h3>Son notlarım</h3>${Object.keys(state.journal).sort().reverse().slice(0,8).map(d=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(d)}</b> <span class="muted">${esc(state.journal[d].mood||'')}</span><div>${esc(state.journal[d].note||'')}</div></div>`).join('')||'<p class="muted">Henüz not yok 🌷</p>'}</div>`;el('journalDate').onchange=e=>{selectedDate=e.target.value;journal()};el('saveJournal').onclick=()=>{state.journal[selectedDate]={mood:el('skinMood').value,note:el('skinNote').value};save();journal()}}
function retinal(){let dates=[...state.retinal].sort().reverse();el('retinal').innerHTML=`<div class="card"><h2>Retinal yolculuğum 🌙</h2><p class="muted">Retinale henüz başlamadın. İlk uygulamadan sonra sayacı kullanabilirsin.</p><div class="stat">${dates.length} <span style="font-size:15px">uygulama</span></div><label class="field">Uygulama tarihi</label><input type="date" id="retDate" value="${selectedDate}"><div class="actionrow"><button class="primary" id="addRet">+ Retinal kullandım</button></div><p class="hint">Başlangıç için haftada bir gece; iyi tolere edilirse kademeli artır.</p></div><div class="card"><h3>Uygulama geçmişi</h3>${dates.length?dates.map(d=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>🌙 ${esc(d)}</span><button class="small danger" data-delret="${esc(d)}">Sil</button></div>`).join(''):'<p class="muted">Henüz kayıt yok.</p>'}</div>`;el('addRet').onclick=()=>{let d=el('retDate').value;if(d&&!state.retinal.includes(d)){state.retinal.push(d);save();retinal()}};document.querySelectorAll('[data-delret]').forEach(b=>b.onclick=()=>{state.retinal=state.retinal.filter(x=>x!==b.dataset.delret);save();retinal()})}
function settings(){el('settings').innerHTML=`<div class="card"><h2>Verilerim ⚙️</h2><p class="muted">Rutinlerin, günlük notların ve işaretlemelerin bu cihazın tarayıcısında saklanır. Telefon değiştirirken yedek almanı öneririm.</p><div class="actionrow"><button class="primary" id="export">⬇️ Yedek indir</button><button id="import">⬆️ Yedek yükle</button><input id="importFile" type="file" accept="application/json,.json" class="hide"></div></div><div class="card notice">⚠️ Bu sürüm yeni veri yapısını kullanıyor. Önceki Glow Routine 2.0 kayıtların varsa eski uygulama dosyalarını sakla; otomatik aktarım garanti değil.</div>`;el('export').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='glow-routine-yedek-'+localDate(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};el('import').onclick=()=>el('importFile').click();el('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.routines)||!v.routines.every(r=>Array.isArray(r.steps)&&Array.isArray(r.days)&&typeof r.id==='string'))throw Error();if(!confirm('Mevcut verilerin bu yedekle değiştirilsin mi?'))return;state={...defaults(),...v};save();render();alert('Yedek yüklendi 💗')}catch{alert('Bu dosya geçerli bir Glow Routine yedeği değil.')}}}
render();if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script></body></html>
